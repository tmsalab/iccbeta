<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="iccbetadTitle iccbetadDesc">
<title id="iccbetadTitle">iccbeta</title>
<desc id="iccbetadDesc">Hexagonal logo for the R package iccbeta. A tight bundle of eight bold lines enters from the left edge and meets at a solid dot: the group regression lines, sharing their intercept at the group-centred predictor. Past the dot they fan out to the right, each with its own slope, and their ends land in an orange density lying on its side, the distribution of the group slopes, labelled beta one j, whose variance ICC beta measures. Under the fan, a solid bar runs from the dot to where the lines end, with the word iccbeta cut out of it. The plate around them is left open.</desc>
